<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DineOS | Forgot password</title><style>body{font:16px system-ui;background:#eef2f6;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;width:min(400px,90vw);padding:34px;border-radius:16px;box-shadow:0 14px 40px #1e35521a}input,button{width:100%;box-sizing:border-box;padding:12px;margin:9px 0;border:1px solid #ccd5e1;border-radius:8px;font:inherit}button{background:#1769e0;color:#fff;border:0;font-weight:700;cursor:pointer}.msg{min-height:22px;font-size:13px}.error{color:#b42318}.ok{color:#087443}a{color:#1769e0}</style></head><body><main class="card"><h1>Reset your password</h1><p>Enter the email or username for your DineOS account.</p><form id="form"><input id="identifier" placeholder="Email or username" autocomplete="username" required><button>Send reset instructions</button><p id="msg" class="msg"></p></form><p><a href="/login">Back to admin login</a> · <a href="/manager-login">Manager login</a> · <a href="/kitchen-login">Kitchen login</a></p></main><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const r=await fetch('/auth/forgot-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identifier:identifier.value.trim()})}),d=await r.json();if(!r.ok){msg.textContent=d.detail||'Unable to start reset';msg.className='msg error';return}msg.textContent=d.reset_url?'Reset link generated for this development environment: '+d.reset_url:d.message;msg.className='msg ok';}</script></body></html>
