<!doctype html>
<html>
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DineOS | Forgot password</title>
  <link rel="stylesheet" href="/css/login-card.css" />
</head>
<body>
  <main class="card wide">
    <h1>Reset your password</h1>
    <p>Enter the email or username for your DineOS account.</p>
    <form id="form">
      <input id="identifier" placeholder="Email or username" autocomplete="username" required />
      <button>Send reset instructions</button>
      <p id="msg" class="msg"></p>
    </form>
    <p>
      <a href="/login">Back to admin login</a> ·
      <a href="/manager-login">Manager login</a> ·
      <a href="/kitchen-login">Kitchen login</a>
    </p>
  </main>
  <script src="/js/dist/forgot-password.js"></script>
</body>
</html>
