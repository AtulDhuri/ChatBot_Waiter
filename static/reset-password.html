<!doctype html>
<html>
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DineOS | Set new password</title>
  <link rel="stylesheet" href="/css/login-card.css" />
</head>
<body>
  <main class="card wide">
    <h1>Choose a new password</h1>
    <p>Use a password with at least 10 characters.</p>
    <form id="form">
      <input id="password" type="password" minlength="10" placeholder="New password"     autocomplete="new-password" required />
      <input id="confirm"  type="password" minlength="10" placeholder="Confirm password" autocomplete="new-password" required />
      <button>Update password</button>
      <p id="msg" class="msg"></p>
    </form>
    <p><a href="/login">Return to login</a></p>
  </main>
  <script src="/js/dist/reset-password.js"></script>
</body>
</html>
