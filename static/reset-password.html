<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DineOS | Set new password</title><style>body{font:16px system-ui;background:#eef2f6;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;width:min(400px,90vw);padding:34px;border-radius:16px;box-shadow:0 14px 40px #1e35521a}input,button{width:100%;box-sizing:border-box;padding:12px;margin:9px 0;border:1px solid #ccd5e1;border-radius:8px;font:inherit}button{background:#1769e0;color:#fff;border:0;font-weight:700;cursor:pointer}.msg{min-height:22px;font-size:13px}.error{color:#b42318}.ok{color:#087443}a{color:#1769e0}</style></head><body><main class="card"><h1>Choose a new password</h1><p>Use a password with at least 10 characters.</p><form id="form"><input id="password" type="password" minlength="10" placeholder="New password" autocomplete="new-password" required><input id="confirm" type="password" minlength="10" placeholder="Confirm password" autocomplete="new-password" required><button>Update password</button><p id="msg" class="msg"></p></form><p><a href="/login">Return to login</a></p></main><script>const token=new URLSearchParams(location.search).get('token')||'';form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value){msg.textContent='Passwords do not match';msg.className='msg error';return}const r=await fetch('/auth/reset-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:password.value})}),d=await r.json();if(!r.ok){msg.textContent=d.detail||'Reset failed';msg.className='msg error';return}msg.textContent=d.message;msg.className='msg ok';setTimeout(()=>location='/login',1200)}</script></body></html>
