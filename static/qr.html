<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DineOS — Table QR Codes</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/qr.css" />
  </head>
  <body>
    <script src="/js/admin-header.js"></script>

    <!-- ── Controls ── -->
    <div class="card controls" id="controlsCard">
      <h1>Generate table QR codes</h1>
      <p class="muted">Each table gets a unique QR code. Guests scan and land directly on the ordering page scoped to their table.</p>
      <div class="row">
        <div>
          <label for="restaurant">Restaurant slug</label>
          <input id="restaurant" type="text" value="demo" placeholder="e.g. seaside-grill" />
        </div>
        <div>
          <label for="table">Table number</label>
          <input id="table" type="text" value="1" placeholder="e.g. 12" />
        </div>
      </div>
      <label for="base">Base URL (where the widget is hosted)</label>
      <input id="base" type="text" placeholder="https://your-host" />
      <p class="hint">Leave blank to use this page's own origin. The restaurant slug is never put in the QR URL.</p>
      <div class="btn-row">
        <button id="go">Generate QR</button>
        <button id="printAll" class="btn-secondary">🖨️ Print all tables</button>
      </div>
      <div id="printAllStatus" class="status-msg" style="display:none"></div>
    </div>

    <!-- ── Single QR result ── -->
    <div class="card" id="out" style="display:none">
      <h2 id="title"></h2>
      <div id="qrcode"></div>
      <div class="link" id="link"></div>
      <a class="btnlink" href="#" onclick="window.print();return false;">🖨️ Print this QR</a>
      <div class="hint">Tip: scan on your phone to test as a guest.</div>
    </div>

    <!-- ── All-tables print grid (hidden on screen, visible on print) ── -->
    <div id="printGrid" style="display:none">
      <div id="printGridInner"></div>
    </div>

    <script src="/qrcode.min.js"></script>
    <script src="/js/dist/qr.js"></script>
  </body>
</html>
