<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DineOS Settings</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/settings.css" />
</head>
<body>
  <script src="/js/admin-header.js"></script>
  <main class="wrap">
    <header class="top">
      <div><h1>Settings</h1><p>Manage restaurant configuration and team access.</p></div>
    </header>
    <section class="card">
      <div class="eyebrow">Team access</div>
      <h2>Staff Management</h2>
      <p class="muted">Create secure portal access for Managers and Kitchen staff.</p>
      <form id="createStaffForm">
        <label>Full name     <input id="name"     maxlength="120" placeholder="Chef Anil" required /></label>
        <label>Username      <input id="username" maxlength="254" pattern="[A-Za-z0-9_.@+-]+" placeholder="chef.anil" required /></label>
        <label>Email         <input id="email"    type="email" placeholder="chef@restaurant.com" required /></label>
        <label>Role          <select id="role"><option value="kitchen">Kitchen</option><option value="manager">Manager</option></select></label>
        <label>Password      <input id="password" type="password" minlength="10" placeholder="At least 10 characters" required /></label>
        <label>Confirm password <input id="confirm" type="password" minlength="10" required /></label>
        <div class="full">
          <button class="primary" id="createButton" type="button">Create user</button>
          <p class="msg" id="msg"></p>
        </div>
      </form>
    </section>
    <section class="card">
      <div class="eyebrow">Access directory</div>
      <h2>Restaurant users</h2>
      <p class="muted">Enable, disable, and reset passwords for your team.</p>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>USER</th><th>USERNAME</th><th>ROLE</th><th>STATUS</th><th>LAST LOGIN</th><th>ACTIONS</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/dist/settings.js"></script>
</body>
</html>
