<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DineOS — Manager Dashboard</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/manager.css" />
    <link rel="stylesheet" href="/css/notify.css" />
  </head>
  <body>
    <script src="/js/admin-header.js"></script>
    <header>
      <h1>📊 Manager Dashboard</h1>
      <div class="spacer"></div>
      <a id="availLink" href="availability.html" style="color:#8fd1ff;text-decoration:none">🍽️ Dish availability</a>
      <a href="reports.html" style="color:#c4b5fd;text-decoration:none">📈 Analytics</a>
      <button id="receiptSettingsBtn" class="ghost">🧾 Receipt settings</button>
      <button id="tokenBtn" class="ghost">🔑 Token</button>
    </header>

    <div class="controls">
      <label>Restaurant
        <input id="restaurant" type="text" value="demo" />
      </label>
      <label>Status
        <select id="status">
          <option value="">All</option>
          <option value="new">New</option>
          <option value="preparing">Preparing</option>
          <option value="ready">Ready</option>
          <option value="served">Served</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </label>
      <label>From <input id="dateFrom" type="date" /></label>
      <label>To   <input id="dateTo"   type="date" /></label>
      <label>&nbsp;<button id="applyBtn" class="primary">Apply filters</button></label>
      <label>&nbsp;<button id="todayBtn" class="ghost">Today</button></label>
      <label>&nbsp;<button id="csvBtn"   class="ghost">⬇ Export CSV</button></label>
      <label>&nbsp;<button id="jsonBtn"  class="ghost">⬇ Export JSON</button></label>
    </div>

    <div id="err" class="err"></div>
    <div id="summary" class="summary"></div>
    <div id="delayedPanel" class="delayed-panel" style="display:none"></div>
    <div class="wrap">
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty" style="display:none">No orders match these filters.</div>
    </div>

    <div id="modalBg" class="modal-bg">
      <div class="modal">
        <h2>Receipt header</h2>
        <p class="sub">Shown at the top of every printed receipt. Saved per restaurant.</p>
        <label>Restaurant name<input id="rsName"     type="text" placeholder="e.g. Priti Pride Family Restaurant" /></label>
        <label>Subtitle line  <input id="rsSubtitle" type="text" placeholder="VEG AND NON VEG" /></label>
        <label>Address        <input id="rsAddress"  type="text" placeholder="Nav Neelkantha Plaza, Dombivli (W)" /></label>
        <label>FSSAI No.      <input id="rsFssai"    type="text" placeholder="11525021000039" /></label>
        <label>Phone(s)       <input id="rsPhone"    type="text" placeholder="7304356110" /></label>
        <label>GSTIN          <input id="rsGstin"    type="text" placeholder="27AFGPP6833D1ZD" /></label>
        <label>Footer line    <input id="rsFooter"   type="text" placeholder="Thank You" /></label>
        <div class="actions">
          <button id="rsCancel" class="ghost">Cancel</button>
          <button id="rsSave"   class="primary">Save</button>
        </div>
      </div>
    </div>

    <div id="receipt"></div>

    <script src="/js/dist/sfetch.js"></script>
    <script src="/js/dist/notify.js"></script>
    <script src="/js/dist/manager.js"></script>
  </body>
</html>
