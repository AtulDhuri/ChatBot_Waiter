<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DineOS — Manager Dashboard</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0; background: #f5f6f8; color: #1d2430;
      }
      header {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 14px 18px; background: #11151a; color: #fff;
        position: sticky; top: 0; z-index: 10;
      }
      header h1 { font-size: 18px; margin: 0; }
      header .spacer { flex: 1; }
      header a, header button { font-size: 14px; }
      .controls {
        display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        padding: 14px 18px; background: #fff; border-bottom: 1px solid #e4e7ec;
      }
      label { font-size: 13px; color: #475467; display: flex; flex-direction: column; gap: 4px; }
      input, select, button {
        padding: 8px 10px; border-radius: 8px; border: 1px solid #d0d5dd;
        font-size: 14px; background: #fff; color: #1d2430;
      }
      button { cursor: pointer; }
      button.primary { background: #2e6cf0; color: #fff; border: none; }
      button.ghost { background: #fff; }
      .summary {
        display: flex; gap: 16px; flex-wrap: wrap;
        padding: 14px 18px;
      }
      .kpi {
        background: #fff; border: 1px solid #e4e7ec; border-radius: 12px;
        padding: 12px 16px; min-width: 130px;
      }
      .kpi .n { font-size: 22px; font-weight: 800; }
      .kpi .l { font-size: 12px; color: #667085; text-transform: uppercase; letter-spacing: .4px; }

      /* ---- Bill cards ---- */
      .wrap { padding: 4px 18px 40px; }
      .cards {
        display: grid; gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
      .bill {
        background: #fff; border: 1px solid #e4e7ec; border-radius: 14px;
        padding: 14px 16px; box-shadow: 0 2px 10px rgba(16,24,40,.04);
        display: flex; flex-direction: column; gap: 10px;
      }
      .bill-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
      .bill-no { font-size: 15px; font-weight: 800; }
      .bill-who { font-size: 13px; color: #475467; margin-top: 2px; }
      .bill-when { font-size: 12px; color: #98a2b3; margin-top: 2px; }
      .zone { font-size: 11px; color: #175cd3; margin-top: 2px; }
      .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
      .pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .2px; white-space: nowrap; }
      .pill.new { background: #fde7e1; color: #b42318; }
      .pill.preparing { background: #fef0c7; color: #b54708; }
      .pill.ready { background: #d1fadf; color: #027a48; }
      .pill.served { background: #eaecf0; color: #475467; }
      .pill.cancelled { background: #eaecf0; color: #98a2b3; text-decoration: line-through; }
      .pay { font-size: 11px; color: #667085; text-transform: uppercase; font-weight: 700; }
      .pay.paid { color: #16803c; }
      .pay.unpaid { color: #b54708; }
      .items { border-top: 1px dashed #e4e7ec; padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
      .items .line { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
      .items .line .nm { color: #1d2430; }
      .items .line .amt { color: #667085; white-space: nowrap; }
      .items .note { color: #b54708; font-style: italic; font-size: 12px; padding-left: 2px; }
      .totals { border-top: 1px dashed #e4e7ec; padding-top: 10px; font-size: 13px; }
      .totals .row { display: flex; justify-content: space-between; padding: 1px 0; color: #475467; }
      .totals .grand { font-weight: 800; font-size: 15px; color: #1d2430; margin-top: 4px; }
      .bill-actions { display: flex; gap: 8px; margin-top: 2px; }
      .bill-actions button { flex: 1; font-size: 13px; }
      button.print { background: #0e9f6e; color: #fff; border: none; }
      button.mark-paid { background: #2e6cf0; color: #fff; border: none; }
      button.mark-unpaid { background: #fff; color: #b54708; border: 1px solid #f79009; }

      .empty { padding: 40px; text-align: center; color: #98a2b3; }
      .err { color: #b42318; padding: 0 18px; }

      /* ---- Receipt settings dialog ---- */
      .modal-bg {
        display: none; position: fixed; inset: 0; background: rgba(16,24,40,.45);
        z-index: 50; align-items: center; justify-content: center; padding: 16px;
      }
      .modal-bg.open { display: flex; }
      .modal {
        background: #fff; border-radius: 14px; padding: 20px; width: 100%;
        max-width: 440px; max-height: 90vh; overflow: auto;
      }
      .modal h2 { margin: 0 0 4px; font-size: 18px; }
      .modal p.sub { margin: 0 0 14px; font-size: 13px; color: #667085; }
      .modal label { margin-bottom: 12px; }
      .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

      /* ---- Thermal receipt (hidden on screen; shown only when printing) ---- */
      #receipt { display: none; }
      @media print {
        body * { visibility: hidden; }
        #receipt, #receipt * { visibility: visible; }
        #receipt {
          display: block; position: absolute; top: 0; left: 0;
          width: 72mm; padding: 2mm 3mm;
          font-family: "Courier New", Courier, monospace;
          color: #000; font-size: 12px; line-height: 1.35;
        }
      }
      #receipt .r-center { text-align: center; }
      #receipt .r-name { font-weight: 700; font-size: 14px; letter-spacing: .5px; }
      #receipt .r-sep { border: none; border-top: 1px dashed #000; margin: 4px 0; }
      #receipt .r-row { display: flex; justify-content: space-between; }
      #receipt table { width: 100%; border-collapse: collapse; }
      #receipt th, #receipt td { font-size: 12px; padding: 1px 0; text-align: left; }
      #receipt th.n, #receipt td.n { text-align: right; }
      #receipt .r-total { font-weight: 700; font-size: 15px; }
      #receipt .r-small { font-size: 11px; }
      @page { margin: 0; }
      :root { color-scheme: dark; }
      body { background:#020617; color:#f8fafc; }
      header { background:#0f172a; border-bottom:1px solid rgba(255,255,255,.10); }
      .controls { background:#0f172a; border-bottom-color:rgba(255,255,255,.10); }
      input, select, button, button.ghost { background:#0f172a; color:#f8fafc; border-color:rgba(255,255,255,.10); }
      button.primary { background:#6366f1; }
      button.primary:hover { background:#4f46e5; }
      .kpi, .bill, .modal { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.10); box-shadow:0 8px 24px rgba(0,0,0,.24); }
      label, .empty { color:#94a3b8; }
      button.print { background:#22c55e; }
      button.mark-paid { background:#3b82f6; }
      a { color:#a855f7 !important; }
      .bill-who, .bill-when, .pay, .items .line .amt, .totals .row, .modal p.sub { color:#94a3b8; }
      .bill-no, .items .line .nm, .totals .grand, .modal h2 { color:#f8fafc; }
      .zone { color:#93c5fd; }
      .items, .totals { border-color:rgba(255,255,255,.10); }
      .items .note { color:#fbbf24; }
      .pill.new { background:rgba(248,113,113,.18); color:#fca5a5; }
      .pill.preparing { background:rgba(245,158,11,.18); color:#fcd34d; }
      .pill.ready { background:rgba(34,197,94,.18); color:#86efac; }
      .pill.served { background:rgba(148,163,184,.18); color:#cbd5e1; }
      .pill.cancelled { background:rgba(148,163,184,.12); color:#94a3b8; }
      .pay.paid { color:#22c55e; }
      .pay.unpaid { color:#fbbf24; }
      .modal-bg { background:rgba(2,6,23,.78); backdrop-filter:blur(4px); }
      .modal input, .modal select, .modal textarea { background:#0f172a; color:#f8fafc; border-color:rgba(255,255,255,.10); }
      .modal input::placeholder, .modal textarea::placeholder { color:#64748b; }
      .modal .actions button { color:#f8fafc; }
      button.mark-unpaid { background:rgba(245,158,11,.12); color:#fbbf24; border-color:#a16207; }
    </style>
  </head>
  <body><script src="/admin-header.js"></script>
    <header>
      <h1>📊 Manager Dashboard</h1>
      <div class="spacer"></div>
      <a id="availLink" href="availability.html" style="color:#8fd1ff;text-decoration:none">🍽️ Dish availability</a>
      <a href="reports.html" style="color:#c4b5fd;text-decoration:none">📈 Analytics</a>
      <button id="receiptSettingsBtn" class="ghost">🧾 Receipt settings</button>
      <button id="tokenBtn" class="ghost">🔑 Token</button>
    </header>

    <div class="controls">
      <label>Restaurant
        <input id="restaurant" type="text" value="demo" />
      </label>
      <label>Status
        <select id="status">
          <option value="">All</option>
          <option value="new">New</option>
          <option value="preparing">Preparing</option>
          <option value="ready">Ready</option>
          <option value="served">Served</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </label>
      <label>From
        <input id="dateFrom" type="date" />
      </label>
      <label>To
        <input id="dateTo" type="date" />
      </label>
      <label>&nbsp;
        <button id="applyBtn" class="primary">Apply filters</button>
      </label>
      <label>&nbsp;
        <button id="todayBtn" class="ghost">Today</button>
      </label>
      <label>&nbsp;
        <button id="csvBtn" class="ghost">⬇ Export CSV</button>
      </label>
      <label>&nbsp;
        <button id="jsonBtn" class="ghost">⬇ Export JSON</button>
      </label>
    </div>

    <div id="err" class="err"></div>
    <div id="summary" class="summary"></div>
    <div class="wrap">
      <div id="cards" class="cards"></div>
      <div id="empty" class="empty" style="display:none">No orders match these filters.</div>
    </div>

    <!-- Receipt settings dialog -->
    <div id="modalBg" class="modal-bg">
      <div class="modal">
        <h2>Receipt header</h2>
        <p class="sub">Shown at the top of every printed receipt. Saved on this device per restaurant.</p>
        <label>Restaurant name (blank = use account name)
          <input id="rsName" type="text" placeholder="e.g. Priti Pride Family Restaurant" />
        </label>
        <label>Subtitle line (e.g. Veg and Non Veg)
          <input id="rsSubtitle" type="text" placeholder="VEG AND NON VEG" />
        </label>
        <label>Address
          <input id="rsAddress" type="text" placeholder="Nav Neelkantha Plaza, Nr. Rly Station, Dombivli (W)" />
        </label>
        <label>FSSAI No.
          <input id="rsFssai" type="text" placeholder="11525021000039" />
        </label>
        <label>Phone(s)
          <input id="rsPhone" type="text" placeholder="7304356110 / 9136xxxxxx" />
        </label>
        <label>GSTIN
          <input id="rsGstin" type="text" placeholder="27AFGPP6833D1ZD" />
        </label>
        <label>Footer line
          <input id="rsFooter" type="text" placeholder="Thank You" />
        </label>
        <div class="actions">
          <button id="rsCancel" class="ghost">Cancel</button>
          <button id="rsSave" class="primary">Save</button>
        </div>
      </div>
    </div>

    <!-- Hidden thermal receipt; populated right before printing -->
    <div id="receipt"></div>

    <script>
      function getToken() { return ""; }
      function promptToken(force) { if (force) location.href="/login.html"; }
      function sfetch(url, opts) { opts=opts||{}; opts.credentials="include"; return fetch(url, opts).then(function(r){ if(r.status===401||r.status===402){location.href="/login.html";throw Error("Authentication required");} return r; }); }

      var cardsEl = document.getElementById("cards");
      var emptyEl = document.getElementById("empty");
      var errEl = document.getElementById("err");
      var summaryEl = document.getElementById("summary");
      var receiptEl = document.getElementById("receipt");

      // Keep loaded orders so Print can look one up by id.
      var ORDERS = {};

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
        });
      }
      function restaurant() { return document.getElementById("restaurant").value.trim() || "demo"; }
      function money(cur, n) { return esc(cur) + Number(n || 0).toFixed(2); }
      function num(n) { return Number(n || 0).toFixed(2); }

      function query() {
        var p = new URLSearchParams();
        p.set("restaurant", restaurant());
        var s = document.getElementById("status").value;
        var df = document.getElementById("dateFrom").value;
        var dt = document.getElementById("dateTo").value;
        if (s) p.set("status", s);
        if (df) p.set("date_from", df);
        if (dt) p.set("date_to", dt);
        return p.toString();
      }

      // ---- Receipt header settings (server-side, shared across devices) ----
      // Cached so the synchronous printReceipt() can read it without a fetch.
      // Refreshed whenever a restaurant's orders load and after a save.
      var RECEIPT_CFG = {};
      function fetchReceiptCfg() {
        return sfetch("/manager/receipt-profile?restaurant=" + encodeURIComponent(restaurant()))
          .then(function (r) { return r.ok ? r.json() : {}; })
          .then(function (cfg) { RECEIPT_CFG = cfg || {}; return RECEIPT_CFG; })
          .catch(function () { RECEIPT_CFG = {}; return RECEIPT_CFG; });
      }
      function openReceiptSettings() {
        // Pull the latest from the server so edits start from the shared copy.
        fetchReceiptCfg().then(function (c) {
          document.getElementById("rsName").value = c.name || "";
          document.getElementById("rsSubtitle").value = c.subtitle || "";
          document.getElementById("rsAddress").value = c.address || "";
          document.getElementById("rsFssai").value = c.fssai || "";
          document.getElementById("rsPhone").value = c.phone || "";
          document.getElementById("rsGstin").value = c.gstin || "";
          document.getElementById("rsFooter").value = c.footer || "";
          document.getElementById("modalBg").classList.add("open");
        });
      }
      function closeReceiptSettings() {
        document.getElementById("modalBg").classList.remove("open");
      }

      function itemsBlock(items, cur) {
        if (!items || !items.length) return "<div class='line'><span class='nm' style='color:#98a2b3'>No items</span></div>";
        return items.map(function (it) {
          var note = it.instructions
            ? "<div class='note'>📝 " + esc(it.instructions) + "</div>"
            : "";
          return "<div class='line'><span class='nm'>" + esc(it.quantity) + "× " + esc(it.name) +
            "</span><span class='amt'>" + money(cur, it.line_total) + "</span></div>" + note;
        }).join("");
      }

      function renderSummary(orders) {
        var cur = orders.length ? orders[0].currency : "";
        var revenue = 0, count = 0;
        orders.forEach(function (o) {
          if (o.status !== "cancelled") { revenue += Number(o.total || 0); count++; }
        });
        summaryEl.innerHTML =
          "<div class='kpi'><div class='n'>" + orders.length + "</div><div class='l'>Orders shown</div></div>" +
          "<div class='kpi'><div class='n'>" + count + "</div><div class='l'>Billable</div></div>" +
          "<div class='kpi'><div class='n'>" + money(cur, revenue) + "</div><div class='l'>Revenue</div></div>";
      }

      function render(orders) {
        errEl.textContent = "";
        cardsEl.innerHTML = "";
        ORDERS = {};
        // Newest first (defensive: sort client-side by created_at desc).
        orders = (orders || []).slice().sort(function (a, b) {
          return new Date(b.created_at) - new Date(a.created_at);
        });
        renderSummary(orders);
        if (!orders.length) { emptyEl.style.display = "block"; return; }
        emptyEl.style.display = "none";

        orders.forEach(function (o) {
          ORDERS[o.id] = o;
          var cur = o.currency;
          var who = o.order_type === "takeaway"
            ? "🥡 " + (o.customer_name ? esc(o.customer_name) : "Takeaway")
            : "Table " + esc(o.table_number);
          var zone = o.zone ? "<div class='zone'>Zone: " + esc(o.zone) + "</div>" : "";
          var when = new Date(o.created_at);
          var whenTxt = isNaN(when.getTime()) ? esc(o.created_at) : when.toLocaleString();

          var card = document.createElement("div");
          card.className = "bill";
          card.innerHTML =
            "<div class='bill-top'>" +
              "<div>" +
                "<div class='bill-no'>" + esc(o.order_no) + "</div>" +
                "<div class='bill-who'>" + who + "</div>" + zone +
                "<div class='bill-when'>" + whenTxt + "</div>" +
              "</div>" +
              "<div class='badges'>" +
                "<span class='pill " + esc(o.status) + "'>" + esc(o.status) + "</span>" +
                "<span class='pay " + (o.payment_status === "verified" ? "paid" : "unpaid") + "'>" +
                  (o.payment_status === "verified" ? "PAID" : "UNPAID") + "</span>" +
              "</div>" +
            "</div>" +
            "<div class='items'>" + itemsBlock(o.items, cur) + "</div>" +
            "<div class='totals'>" +
              "<div class='row'><span>Subtotal</span><span>" + money(cur, o.subtotal) + "</span></div>" +
              (Number(o.tax) ? "<div class='row'><span>Tax</span><span>" + money(cur, o.tax) + "</span></div>" : "") +
              "<div class='row grand'><span>Total</span><span>" + money(cur, o.total) + "</span></div>" +
            "</div>" +
            "<div class='bill-actions'>" +
              "<button class='print' data-id='" + esc(o.id) + "'>🖨 Print receipt</button>" +
              (o.payment_status !== "verified"
                ? "<button class='mark-paid' data-id='" + esc(o.id) + "' data-payment='paid'>✓ Mark bill PAID</button>"
                : "<button class='mark-unpaid' data-id='" + esc(o.id) + "' data-payment='unpaid'>↩ Mark bill UNPAID</button>") +
            "</div>";
          cardsEl.appendChild(card);
        });

        // Wire up per-card print buttons.
        Array.prototype.forEach.call(cardsEl.querySelectorAll("button.print"), function (btn) {
          btn.addEventListener("click", function () {
            printReceipt(ORDERS[btn.getAttribute("data-id")]);
          });
        });
        // Payment status: update the card instantly, refresh in background.
        Array.prototype.forEach.call(cardsEl.querySelectorAll("button.mark-paid, button.mark-unpaid"), function (btn) {
          btn.addEventListener("click", function () {
            btn.disabled = true;
            var isPaid = btn.getAttribute("data-payment") === "paid";
            var orderId = btn.getAttribute("data-id");
            var card = btn.closest(".bill");
            // Optimistic UI: flip the button label immediately
            if (card) {
              var otherBtn = card.querySelector(isPaid ? ".mark-paid" : ".mark-unpaid");
              if (otherBtn) {
                otherBtn.className = isPaid ? "mark-unpaid" : "mark-paid";
                otherBtn.setAttribute("data-payment", isPaid ? "unpaid" : "paid");
                otherBtn.textContent = isPaid ? "↩ Mark bill UNPAID" : "✓ Mark bill PAID";
                otherBtn.disabled = false;
              }
              if (ORDERS[orderId]) {
                ORDERS[orderId].payment_status = isPaid ? "verified" : "unpaid";
              }
            }
            sfetch("/order/" + encodeURIComponent(orderId), {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ payment_status: isPaid ? "verified" : "unpaid" }),
            })
              .then(function (r) {
                if (!r.ok) throw new Error("Could not change payment status");
                return r.json();
              })
              .then(function () {
                // Quiet background sync to catch any concurrent changes
                sfetch("/manager/orders?" + query())
                  .then(function (r) { return r.ok ? r.json() : null; })
                  .then(function (orders) {
                    if (!orders) return;
                    var sig = signature(orders);
                    if (sig !== _lastSig) { _lastSig = sig; render(orders); }
                  })
                  .catch(function () {});
              })
              .catch(function (e) {
                // Rollback optimistic update on error
                btn.disabled = false;
                errEl.textContent = e.message;
                load();
              });
          });
        });
      }

      // ---- Build + print a thermal receipt matching the shop format ----
      function printReceipt(o) {
        if (!o) return;
        var cfg = RECEIPT_CFG || {};
        var name = cfg.name || (window.__restName || restaurant());
        var when = new Date(o.created_at);
        var dateStr, timeStr;
        if (isNaN(when.getTime())) { dateStr = esc(o.created_at); timeStr = ""; }
        else {
          dateStr = when.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "2-digit", weekday: "short" });
          timeStr = when.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
        }

        var header = "<div class='r-center'>" +
          "<div class='r-name'>" + esc(name) + "</div>" +
          (cfg.subtitle ? "<div>" + esc(cfg.subtitle) + "</div>" : "") +
          (cfg.address ? "<div class='r-small'>" + esc(cfg.address) + "</div>" : "") +
          (cfg.fssai ? "<div class='r-small'>FSSAI No. " + esc(cfg.fssai) + "</div>" : "") +
          (cfg.phone ? "<div class='r-small'>Tel. " + esc(cfg.phone) + "</div>" : "") +
          "</div>";

        var items = (o.items || []).map(function (it) {
          var q = Number(it.quantity || 0);
          var lt = Number(it.line_total != null ? it.line_total : (Number(it.price || 0) * q));
          var rate = Number(it.price != null ? it.price : (q ? lt / q : 0));
          // Instructions are intentionally NOT printed on the receipt (kept
          // off the customer's paper bill); they still show on the manager card.
          return "<tr>" +
            "<td>" + esc(it.name) + "</td>" +
            "<td class='n'>" + q + "</td>" +
            "<td class='n'>" + num(rate) + "</td>" +
            "<td class='n'>" + num(lt) + "</td>" +
          "</tr>";
        }).join("");

        var who = o.order_type === "takeaway"
          ? ("Takeaway" + (o.customer_name ? " \u00b7 " + esc(o.customer_name) : ""))
          : ("Tbl: " + esc(o.table_number));

        receiptEl.innerHTML =
          header +
          "<hr class='r-sep'/>" +
          "<div class='r-center'>*** TAX INVOICE ***</div>" +
          "<hr class='r-sep'/>" +
          "<div class='r-row r-small'><span>" + dateStr + " " + timeStr + "</span>" +
            "<span>Bill: " + esc(o.order_no) + "</span></div>" +
          "<div class='r-row r-small'><span>" + who + "</span>" +
            (o.zone ? "<span>" + esc(o.zone) + "</span>" : "<span></span>") + "</div>" +
          "<hr class='r-sep'/>" +
          "<table>" +
            "<thead><tr><th>Name Of Item</th><th class='n'>Qty</th><th class='n'>Rate</th><th class='n'>Amount</th></tr></thead>" +
            "<tbody>" + items + "</tbody>" +
          "</table>" +
          "<hr class='r-sep'/>" +
          "<div class='r-row'><span></span><span>Sub Total: " + num(o.subtotal) + "</span></div>" +
          (Number(o.tax) ? "<div class='r-row'><span></span><span>Tax: " + num(o.tax) + "</span></div>" : "") +
          "<div class='r-row'><span></span><span>Food Total: " + num(o.total) + "</span></div>" +
          "<hr class='r-sep'/>" +
          "<div class='r-total'>TOTAL =&gt; RS. " + num(o.total) + "</div>" +
          (cfg.gstin ? "<div class='r-small'>GSTIN: " + esc(cfg.gstin) + "</div>" : "") +
          "<div class='r-center' style='margin-top:6px'>***** " + esc(cfg.footer || "Thank You") + " *****</div>";

        window.print();
      }

      function load() {
        // Refresh the shared receipt header for this outlet so Print works
        // without opening settings first. Non-blocking: orders still load even
        // if the profile fetch fails.
        fetchReceiptCfg();
        sfetch("/manager/orders?" + query())
          .then(function (r) { if (!r.ok) throw new Error("Load failed (" + r.status + ")"); return r.json(); })
          .then(function (orders) {
            if (orders.length && orders[0].restaurant_name) window.__restName = orders[0].restaurant_name;
            // Keep the auto-refresh fingerprint in sync so the next quiet poll
            // doesn't re-render identical data right after a manual load.
            if (typeof signature === "function") _lastSig = signature(orders);
            render(orders);
          })
          .catch(function (e) { errEl.textContent = e.message; });
      }

      // Default the date range to today (both From and To).
      function todayStr() {
        var d = new Date();
        var mm = String(d.getMonth() + 1).padStart(2, "0");
        var dd = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + mm + "-" + dd;
      }
      function setToday() {
        var t = todayStr();
        document.getElementById("dateFrom").value = t;
        document.getElementById("dateTo").value = t;
      }

      document.getElementById("applyBtn").onclick = load;
      document.getElementById("todayBtn").onclick = function () { setToday(); load(); };
      document.getElementById("tokenBtn").onclick = function () { promptToken(true); };
      document.getElementById("receiptSettingsBtn").onclick = openReceiptSettings;
      document.getElementById("rsCancel").onclick = closeReceiptSettings;
      document.getElementById("modalBg").addEventListener("click", function (e) {
        if (e.target === this) closeReceiptSettings();
      });
      document.getElementById("rsSave").onclick = function () {
        var saveBtn = this;
        var body = {
          restaurant: restaurant(),
          name: document.getElementById("rsName").value.trim(),
          subtitle: document.getElementById("rsSubtitle").value.trim(),
          address: document.getElementById("rsAddress").value.trim(),
          fssai: document.getElementById("rsFssai").value.trim(),
          phone: document.getElementById("rsPhone").value.trim(),
          gstin: document.getElementById("rsGstin").value.trim(),
          footer: document.getElementById("rsFooter").value.trim(),
        };
        saveBtn.disabled = true;
        sfetch("/manager/receipt-profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        })
          .then(function (r) { if (!r.ok) throw new Error("Save failed (" + r.status + ")"); return r.json(); })
          .then(function (cfg) {
            RECEIPT_CFG = cfg || {};
            closeReceiptSettings();
          })
          .catch(function (e) { errEl.textContent = e.message; })
          .then(function () { saveBtn.disabled = false; });
      };
      document.getElementById("csvBtn").onclick = function () {
        var url = "/manager/orders.csv?" + query() + "&token=" + encodeURIComponent(getToken());
        window.open(url, "_blank");
      };
      document.getElementById("jsonBtn").onclick = function () {
        sfetch("/manager/orders?" + query())
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            var a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "orders-" + restaurant() + ".json";
            a.click();
          })
          .catch(function (e) { errEl.textContent = e.message; });
      };

      // ---- Auto-refresh: pull new orders without a manual reload ----
      // Quiet poll: fetch on an interval and only re-render when the data
      // actually changed (so cards don't flicker or steal a Print click). We
      // skip a tick while the receipt-settings modal is open or the tab is
      // hidden, and always refresh immediately when the tab regains focus.
      var REFRESH_MS = 8000;
      var _refreshTimer = null;
      var _lastSig = null;

      function signature(orders) {
        // Compact fingerprint of what's on screen: order id + status + payment
        // + total. Changes when an order is added, advanced, or re-billed.
        return (orders || []).map(function (o) {
          return o.id + ":" + o.status + ":" + o.payment_status + ":" + o.total;
        }).join("|");
      }

      function quietRefresh() {
        if (document.hidden) return;
        if (document.getElementById("modalBg").classList.contains("open")) return;
        fetchReceiptCfg();
        sfetch("/manager/orders?" + query())
          .then(function (r) { if (!r.ok) throw new Error("Load failed (" + r.status + ")"); return r.json(); })
          .then(function (orders) {
            if (orders.length && orders[0].restaurant_name) window.__restName = orders[0].restaurant_name;
            var sig = signature(orders);
            if (sig !== _lastSig) {
              _lastSig = sig;
              render(orders);
            }
          })
          .catch(function () { /* transient; try again next tick */ });
      }

      function startAutoRefresh() {
        if (_refreshTimer) return;
        _refreshTimer = setInterval(quietRefresh, REFRESH_MS);
      }

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) quietRefresh();
      });
      window.addEventListener("focus", quietRefresh);

      // Prefill restaurant from ?r=, default to today, and load.
      (function () {
        var r = new URLSearchParams(location.search).get("r");
        if (r) {
          document.getElementById("restaurant").value = r;
          document.getElementById("availLink").href = "availability.html?r=" + encodeURIComponent(r);
        }
        setToday();
        if (!getToken()) promptToken(false);
        load();
        startAutoRefresh();
      })();
      // Keep the availability link pointed at the current restaurant.
      document.getElementById("restaurant").addEventListener("change", function () {
        document.getElementById("availLink").href =
          "availability.html?r=" + encodeURIComponent(restaurant());
      });
    </script>
  </body>
</html>
