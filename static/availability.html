<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DineOS — Dish Availability</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/availability.css" />
  </head>
  <body>
    <script src="/js/admin-header.js"></script>
    <header>
      <h1>🍽️ Dish Availability</h1>
      <div class="spacer"></div>
      <a id="mgrLink" href="manager.html" style="color:#8fd1ff;font-size:14px;text-decoration:none">📊 Dashboard</a>
      <button id="tokenBtn" class="ghost">🔑 Token</button>
    </header>

    <div class="controls">
      <label style="font-size:13px;color:#475467">Restaurant
        <input id="restaurant" type="text" value="demo" style="margin-left:6px" />
      </label>
      <input id="search" type="search" placeholder="🔍 Search dishes…" aria-label="Search dishes" />
      <select id="filter" aria-label="Filter by availability">
        <option value="all">All dishes</option>
        <option value="available">Available only</option>
        <option value="unavailable">Sold out only</option>
      </select>
      <button id="reloadBtn" class="ghost">↻ Reload</button>
      <div class="bulk">
        <button id="allOnBtn"  class="ghost">Mark all available</button>
        <button id="allOffBtn" class="ghost">Mark all sold out</button>
      </div>
    </div>

    <div id="stat" class="stat"></div>
    <div id="err"  class="err"></div>
    <div class="wrap">
      <div id="list"></div>
      <div id="empty" class="empty" style="display:none">No dishes match.</div>
    </div>
    <div id="toast" class="toast"></div>

    <script src="/js/dist/sfetch.js"></script>
    <script src="/js/dist/availability.js"></script>
  </body>
</html>
