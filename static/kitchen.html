<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DineOS — Kitchen Display</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0; background: #11151a; color: #eceff3;
      }
      header {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 12px 16px; background: #0b0e12; border-bottom: 1px solid #222;
        position: sticky; top: 0; z-index: 10;
      }
      header h1 { font-size: 18px; margin: 0; }
      header .spacer { flex: 1; }
      header input, header button {
        padding: 8px 10px; border-radius: 8px; border: 1px solid #333;
        background: #1b2129; color: #eceff3; font-size: 14px;
      }
      header button { cursor: pointer; background: #2e6cf0; border: none; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #2e9e5b;
        display: inline-block; margin-right: 6px; }
      .grid { padding: 16px; display: flex; flex-direction: column; gap: 20px; }
      .table-group { }
      .table-head {
        display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px;
        padding-bottom: 6px; border-bottom: 1px solid #2a323c;
      }
      .table-head h2 { font-size: 16px; margin: 0; color: #eceff3; }
      .table-head .count {
        font-size: 12px; color: #8591a0; background: #1b2129;
        padding: 2px 8px; border-radius: 20px;
      }
      .table-cards {
        display: grid; gap: 14px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      .card {
        background: #1b2129; border: 1px solid #2a323c; border-radius: 12px;
        padding: 12px; display: flex; flex-direction: column; gap: 8px;
      }
      .card.new { border-left: 5px solid #e4572e; }
      .card.preparing { border-left: 5px solid #e0a526; }
      .card.ready { border-left: 5px solid #2e9e5b; }
      .top { display: flex; justify-content: space-between; align-items: baseline; }
      .ono { font-size: 20px; font-weight: 800; }
      .tbl { font-size: 13px; color: #aeb7c2; }
      .badge {
        font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .4px;
      }
      .badge.dine_in { background: #233; color: #8fd; }
      .badge.takeaway { background: #332; color: #fd8; }
      .items { font-size: 14px; line-height: 1.5; }
      .items .q { color: #9fb; font-weight: 700; }
      .items .note {
        font-size: 12px; color: #ffd27f; margin: 2px 0 4px 18px;
        font-style: italic;
      }
      .zone { font-size: 11px; color: #8fd1ff; }
      .meta { font-size: 12px; color: #8591a0; }
      .pay { font-size: 11px; }
      .pay.unverified { color: #e0a526; }
      .pay.verified { color: #2e9e5b; }
      .actions { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
      .actions button {
        flex: 1; min-width: 84px; padding: 8px; border-radius: 8px; border: none;
        cursor: pointer; font-size: 13px; font-weight: 600; color: #fff;
      }
      .b-advance { background: #2e6cf0; }
      .b-cancel { background: #6b2230; }
      .actions button:disabled { opacity: .5; cursor: default; }
      .empty { padding: 40px; text-align: center; color: #6b7682; }
      .err { color: #e4572e; padding: 0 16px; }
      :root { color-scheme: dark; }
      body { background:#020617; color:#f8fafc; }
      header { background:#0f172a; border-bottom-color:rgba(255,255,255,.10); }
      header input { background:#0f172a; border-color:rgba(255,255,255,.10); }
      header button, .b-advance { background:#6366f1; }
      header button:hover, .b-advance:hover { background:#4f46e5; }
      .card { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.10); }
      .card.new { border-left-color:#6366f1; }
      .card.ready { border-left-color:#22c55e; }
      .empty { color:#94a3b8; }
    </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
  <body><script src="/admin-header.js"></script>
    <header>
      <h1>🍳 Kitchen Display</h1>
      <span class="tbl"><span class="dot"></span><span id="live">live</span></span>
      <div class="spacer"></div>
      <label class="tbl manager-only">Restaurant
        <input id="restaurant" type="text" value="demo" />
      </label>
      <label class="tbl manager-only">Close table #
        <input id="closeTable" type="text" placeholder="e.g. 7" style="width:80px" />
      </label>
      <button id="closeBtn" class="manager-only">Close table</button>
      <button id="tokenBtn" class="manager-only" style="background:#444">🔑 Token</button>
      <button id="logoutBtn" style="background:#8a2433">Log out</button>
    </header>

    <div id="err" class="err"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">
      No active orders. New orders appear here automatically.
    </div>

    <script>
      var POLL_MS = 8000;
      var grid = document.getElementById("grid");
      var emptyEl = document.getElementById("empty");
      var errEl = document.getElementById("err");
      var liveEl = document.getElementById("live");

      // JWT is an HttpOnly cookie; pages never store credentials.
      var currentRole = "";
      var realtimeActive = false;
      var realtimeClient = null;
      function getToken() { return ""; }
      function promptToken(force) { if (force) location.href="/login.html"; }
      function sfetch(url, opts) { opts=opts||{}; opts.credentials="include"; return fetch(url, opts).then(function(r){ if(r.status===401||r.status===402){location.href="/login.html";throw Error("Authentication required");} return r; }); }

      function restaurant() {
        var u = new URLSearchParams(location.search).get("r");
        if (u) document.getElementById("restaurant").value = u;
        return document.getElementById("restaurant").value.trim() || "demo";
      }

      // Kitchen flow: New -> Preparing -> Served. The customer sees this as
      // Placed -> Preparing -> Served. Payment is a separate staff action.
      var NEXT = { new: "preparing", preparing: "ready", ready: "served" };
      var NEXT_LABEL = { new: "Start cooking", preparing: "Mark ready", ready: "Mark served" };

      function esc(s) {
        return String(s).replace(/[&<>]/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
        });
      }

      function patch(id, body) {
        return sfetch("/order/" + id, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }).then(function (r) {
          if (!r.ok) throw new Error("update failed");
          return r.json();
        });
      }

      // Group key for an order: dine-in orders group by their table number;
      // takeaway has no table, so each groups on its own under "Takeaway".
      function groupKey(o) {
        return o.order_type === "takeaway" ? "__takeaway__" : (o.table_number || "-");
      }
      function groupLabel(o) {
        return o.order_type === "takeaway" ? "🥡 Takeaway" : "Table " + o.table_number;
      }

      function render(orders) {
        errEl.textContent = "";
        grid.innerHTML = "";
        if (!orders.length) {
          emptyEl.style.display = "block";
          return;
        }
        emptyEl.style.display = "none";

        // Group orders by table so staff see all active orders for a table
        // together. Each order stays a separate card (never merged).
        var groups = {};
        var order = [];
        orders.forEach(function (o) {
          var k = groupKey(o);
          if (!groups[k]) { groups[k] = { label: groupLabel(o), list: [] }; order.push(k); }
          groups[k].list.push(o);
        });

        order.forEach(function (k) {
          var g = groups[k];
          var section = document.createElement("div");
          section.className = "table-group";
          var head = document.createElement("div");
          head.className = "table-head";
          head.innerHTML =
            "<h2>" + esc(g.label) + "</h2>" +
            "<span class='count'>" + g.list.length +
            " order" + (g.list.length === 1 ? "" : "s") + "</span>";
          section.appendChild(head);

          var cards = document.createElement("div");
          cards.className = "table-cards";
          g.list.forEach(function (o) { cards.appendChild(buildCard(o)); });
          section.appendChild(cards);
          grid.appendChild(section);
        });
      }

      function buildCard(o) {
          var card = document.createElement("div");
          card.className = "card " + o.status;

          var items = (o.items || [])
            .map(function (it) {
              var note = it.instructions
                ? "<div class='note'>📝 " + esc(it.instructions) + "</div>"
                : "";
              return (
                "<div><span class='q'>" + it.quantity + "×</span> " +
                esc(it.name) + note + "</div>"
              );
            })
            .join("");

          var t = new Date(o.created_at);
          var mins = Math.max(0, Math.round((Date.now() - t.getTime()) / 60000));

          card.innerHTML =
            "<div class='top'><span class='ono'>" + esc(o.order_no) + "</span>" +
            "<span class='badge " + o.order_type + "'>" +
            (o.order_type === "takeaway"
              ? "🥡 " + (o.customer_name ? esc(o.customer_name) : "Takeaway")
              : "Table " + esc(o.table_number)) +
            "</span></div>" +
            (o.zone ? "<div class='zone'>Zone: " + esc(o.zone) + "</div>" : "") +
            "<div class='items'>" + items + "</div>" +
            "<div class='meta'>" + o.currency + Number(o.total).toFixed(2) +
            " · " + mins + " min ago</div>";

          var actions = document.createElement("div");
          actions.className = "actions";

          // Update card UI instantly, then sync in background
          function lock(btn, promise) {
            var btns = actions.querySelectorAll("button");
            Array.prototype.forEach.call(btns, function (b) { b.disabled = true; });
            promise.then(function(updated) {
              // patch the card inline without waiting for a full poll
              if (updated && updated.status) {
                card.className = "card " + updated.status;
              }
              // background sync
              poll();
            }, function (e) {
              Array.prototype.forEach.call(btns, function (b) { b.disabled = false; });
              showErr(e);
            });
          }

          if (NEXT[o.status]) {
            var adv = document.createElement("button");
            adv.className = "b-advance";
            adv.textContent = NEXT_LABEL[o.status];
            adv.onclick = function () {
              lock(adv, patch(o.id, { status: NEXT[o.status] }));
            };
            actions.appendChild(adv);
          }
          if (o.status !== "cancelled" && currentRole !== "kitchen") {
            var cancel = document.createElement("button");
            cancel.className = "b-cancel";
            cancel.textContent = "Cancel";
            cancel.onclick = function () {
              if (confirm("Cancel order " + o.order_no + "?"))
                lock(cancel, patch(o.id, { status: "cancelled" }));
            };
            actions.appendChild(cancel);
          }

          card.appendChild(actions);
          return card;
      }

      function showErr(e) {
        errEl.textContent = "Error: " + e.message;
      }

      var pollInFlight = false;
      function poll() {
        if (pollInFlight || document.hidden) return Promise.resolve();
        pollInFlight = true;
        return sfetch(
          "/orders?restaurant=" + encodeURIComponent(restaurant()) +
            "&active_only=true"
        )
          .then(function (r) {
            if (!r.ok) throw new Error("could not load orders");
            return r.json();
          })
          .then(render)
          .catch(showErr)
          .finally(function () { pollInFlight = false; });
      }

      document.getElementById("closeBtn").addEventListener("click", function () {
        var tn = document.getElementById("closeTable").value.trim();
        if (!tn) return;
        sfetch("/close-table", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ restaurant: restaurant(), table_number: tn }),
        })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            errEl.textContent = "Closed " + d.closed + " order(s) for table " + tn + ".";
            document.getElementById("closeTable").value = "";
            poll();
          })
          .catch(showErr);
      });

      document.getElementById("tokenBtn").addEventListener("click", function () {
        promptToken(true);
        poll();
      });

      document.getElementById("logoutBtn").addEventListener("click", function () {
        fetch("/auth/logout", { method: "POST", credentials: "include" }).finally(function () { location.href = "/kitchen-login"; });
      });
      function setupRealtime(identity) {
        if (!window.supabase || !identity || !identity.outletId) return Promise.resolve(false);
        return fetch("/auth/realtime-token", { credentials: "include" })
          .then(function (r) { if (!r.ok) throw new Error("Realtime not configured"); return r.json(); })
          .then(function (config) {
            realtimeClient = window.supabase.createClient(config.url, config.anonKey, {
              accessToken: function () { return Promise.resolve(config.accessToken); }
            });
            var channel = realtimeClient.channel("kitchen-outlet-" + config.outletId, { config: { private: true } });
            channel.on("postgres_changes", { event: "*", schema: "public", table: "orders", filter: "restaurant_id=eq." + config.outletId }, function () {
              poll();
            });
            return new Promise(function (resolve) {
              channel.subscribe(function (status) {
                if (status === "SUBSCRIBED") { realtimeActive = true; resolve(true); }
                if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") resolve(false);
              });
            });
          })
          .catch(function () { realtimeActive = false; return false; });
      }

      function loadIdentity() {
        return fetch("/auth/me", { credentials: "include" }).then(function (r) {
          if (!r.ok) throw new Error("Authentication required");
          return r.json();
        }).then(function (me) {
          currentRole = me.role || "";
          if (currentRole === "kitchen") {
            Array.prototype.forEach.call(document.querySelectorAll(".manager-only"), function (el) { el.style.display = "none"; });
            document.querySelector("h1").textContent = "Kitchen Portal";
          }
          return setupRealtime(me).then(function () { return poll(); });
        }).catch(function () { location.href = "/kitchen-login"; });
      }

      loadIdentity();
      setInterval(function () {
        liveEl.textContent = liveEl.textContent === "live" ? "·live·" : "live";
        if (!realtimeActive) poll();
      }, POLL_MS);
    </script>
  </body>
</html>
