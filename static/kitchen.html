<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DineOS — Kitchen Display</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/kitchen.css" />
    <link rel="stylesheet" href="/css/notify.css" />
  </head>
  <body>
    <script src="/js/admin-header.js"></script>
    <header>
      <h1>🍳 Kitchen Display</h1>
      <span class="tbl"><span class="dot"></span><span id="live">live</span></span>
      <div class="spacer"></div>
      <label class="tbl manager-only">Restaurant
        <input id="restaurant" type="text" value="demo" />
      </label>
      <label class="tbl manager-only">Close table #
        <input id="closeTable" type="text" placeholder="e.g. 7" style="width:80px" />
      </label>
      <button id="closeBtn"  class="manager-only">Close table</button>
      <button id="tokenBtn"  class="manager-only" style="background:#444">🔑 Token</button>
      <button id="logoutBtn" style="background:#8a2433">Log out</button>
    </header>

    <div id="err"   class="err"></div>
    <div id="grid"  class="grid"></div>
    <div id="empty" class="empty" style="display:none">
      No active orders. New orders appear here automatically.
    </div>

    <script src="/js/dist/sfetch.js"></script>
    <script src="/js/dist/notify.js"></script>
    <script src="/js/dist/kitchen.js"></script>
  </body>
</html>
