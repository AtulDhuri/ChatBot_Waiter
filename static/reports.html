<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales Reports</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0; background: #faf7f5; color: #222; padding: 24px 16px;
      }
      .wrap { max-width: 820px; margin: 0 auto; }
      h1 { margin: 0 0 16px; }
      .card {
        background: #fff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.07);
        padding: 20px; margin-bottom: 18px;
      }
      .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
      .controls label { display: block; font-size: 13px; color: #555; }
      .controls input {
        display: block; margin-top: 4px; padding: 9px; border: 1px solid #ddd;
        border-radius: 9px; font-size: 14px;
      }
      button {
        padding: 10px 16px; border: none; border-radius: 9px; font-size: 14px;
        cursor: pointer; color: #fff; background: #e4572e;
      }
      button.alt { background: #2e9e5b; }
      button.ghost { background: #555; }
      .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .kpi { background: #faf7f5; border-radius: 10px; padding: 14px; text-align: center; }
      .kpi .n { font-size: 24px; font-weight: 800; color: #e4572e; }
      .kpi .l { font-size: 12px; color: #777; margin-top: 2px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { padding: 8px 6px; border-bottom: 1px solid #eee; text-align: left; }
      th.r, td.r { text-align: right; }
      .muted { color: #777; font-size: 13px; }
      .chips { display: flex; gap: 8px; margin-bottom: 8px; }
      .chips button { background: #efe9e6; color: #8a3b22; }
      @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>📊 Sales Reports</h1>

      <div class="card">
        <div class="controls">
          <div>
            <label>Restaurant slug</label>
            <input id="restaurant" type="text" value="demo" />
          </div>
          <div>
            <label>From</label>
            <input id="from" type="date" />
          </div>
          <div>
            <label>To</label>
            <input id="to" type="date" />
          </div>
          <button id="run">Run report</button>
          <button id="csv" class="alt">Download CSV</button>
        </div>
        <div class="chips" style="margin-top:12px">
          <button data-range="today">Today</button>
          <button data-range="7">Last 7 days</button>
          <button data-range="30">Last 30 days</button>
          <button data-range="all">All time</button>
        </div>
      </div>

      <div class="card">
        <div class="kpis">
          <div class="kpi"><div class="n" id="k_orders">—</div><div class="l">Orders</div></div>
          <div class="kpi"><div class="n" id="k_sub">—</div><div class="l">Subtotal</div></div>
          <div class="kpi"><div class="n" id="k_tax">—</div><div class="l">Tax</div></div>
          <div class="kpi"><div class="n" id="k_total">—</div><div class="l">Gross sales</div></div>
        </div>
        <p class="muted" id="statusLine" style="margin-top:14px"></p>
      </div>

      <div class="card">
        <h3 style="margin-top:0">Top selling items</h3>
        <table>
          <thead><tr><th>Item</th><th class="r">Qty</th><th class="r">Revenue</th></tr></thead>
          <tbody id="items"><tr><td colspan="3" class="muted">Run a report to see data.</td></tr></tbody>
        </table>
      </div>
    </div>

    <script>
      // ---- Staff auth ----
      var TOKEN_KEY = "waiter_staff_token";
      function getToken() { return localStorage.getItem(TOKEN_KEY) || ""; }
      function promptToken(force) {
        if (!force && getToken()) return;
        var t = window.prompt("Enter staff access token:", getToken());
        if (t !== null) localStorage.setItem(TOKEN_KEY, t.trim());
      }
      function sfetch(url, opts) {
        opts = opts || {};
        opts.headers = opts.headers || {};
        opts.headers["X-Staff-Token"] = getToken();
        return fetch(url, opts).then(function (r) {
          if (r.status === 401) { promptToken(true); throw new Error("Staff auth required"); }
          return r;
        });
      }

      function restaurant() {
        var u = new URLSearchParams(location.search).get("r");
        if (u) document.getElementById("restaurant").value = u;
        return document.getElementById("restaurant").value.trim() || "demo";
      }
      function iso(d) { return d.toISOString().slice(0, 10); }

      function qs() {
        var r = encodeURIComponent(restaurant());
        var f = document.getElementById("from").value;
        var t = document.getElementById("to").value;
        var q = "restaurant=" + r;
        if (f) q += "&date_from=" + f;
        if (t) q += "&date_to=" + t;
        return q;
      }

      function setRange(kind) {
        var to = new Date();
        var from = new Date();
        if (kind === "today") { /* from = today */ }
        else if (kind === "7") from.setDate(to.getDate() - 6);
        else if (kind === "30") from.setDate(to.getDate() - 29);
        else if (kind === "all") {
          document.getElementById("from").value = "";
          document.getElementById("to").value = "";
          return run();
        }
        document.getElementById("from").value = iso(from);
        document.getElementById("to").value = iso(to);
        run();
      }

      function run() {
        sfetch("/reports?" + qs())
          .then(function (r) {
            if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || "failed"); });
            return r.json();
          })
          .then(function (d) {
            var cur = d.currency || "";
            document.getElementById("k_orders").textContent = d.order_count;
            document.getElementById("k_sub").textContent = cur + d.subtotal.toFixed(2);
            document.getElementById("k_tax").textContent = cur + d.tax.toFixed(2);
            document.getElementById("k_total").textContent = cur + d.total.toFixed(2);

            var by = d.by_status || {};
            document.getElementById("statusLine").textContent =
              "By status — " +
              Object.keys(by).map(function (k) { return k + ": " + by[k]; }).join(", ") ||
              "No orders in range.";

            var tb = document.getElementById("items");
            if (!d.top_items.length) {
              tb.innerHTML = "<tr><td colspan='3' class='muted'>No sales in this range.</td></tr>";
            } else {
              tb.innerHTML = d.top_items.map(function (it) {
                return "<tr><td>" + it.name + "</td><td class='r'>" + it.quantity +
                  "</td><td class='r'>" + cur + it.revenue.toFixed(2) + "</td></tr>";
              }).join("");
            }
          })
          .catch(function (e) {
            document.getElementById("statusLine").textContent = "Error: " + e.message;
          });
      }

      document.getElementById("run").addEventListener("click", run);
      document.getElementById("csv").addEventListener("click", function () {
        // Downloads can't set headers, so pass the token as a query param.
        var t = encodeURIComponent(getToken());
        window.location = "/reports/csv?" + qs() + "&token=" + t;
      });
      Array.prototype.forEach.call(document.querySelectorAll(".chips button"), function (b) {
        b.addEventListener("click", function () { setRange(b.getAttribute("data-range")); });
      });

      restaurant();
      promptToken(false);
      setRange("today");
    </script>
  </body>
</html>
