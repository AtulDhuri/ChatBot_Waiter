<!doctype html>
<html>
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DineOS Staff</title>
  <link rel="stylesheet" href="/css/staff.css" />
</head>
<body>
  <main class="wrap">
    <h1>Staff Management</h1>
    <p>Create and manage users for this restaurant.</p>
    <section class="card">
      <h2>Create staff user</h2>
      <form id="create">
        <label>Name            <input id="name"     required /></label>
        <label>Username        <input id="username" pattern="[A-Za-z0-9_.@+-]+" required /></label>
        <label>Email           <input id="email"    type="email" required /></label>
        <label>Role            <select id="role"><option value="kitchen">Kitchen</option><option value="manager">Manager</option></select></label>
        <label>Password        <input id="password" type="password" minlength="10" required /></label>
        <label>Confirm password<input id="confirm"  type="password" minlength="10" required /></label>
        <div class="full">
          <button>Create user</button>
          <p id="msg" class="msg"></p>
        </div>
      </form>
    </section>
    <section class="card">
      <h2>Users</h2>
      <table class="table">
        <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Last login</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script src="/js/dist/staff.js"></script>
</body>
</html>
