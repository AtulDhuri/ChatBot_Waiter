<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DineOS Staff</title><style>body{font:15px system-ui;background:#f5f7fb;color:#182230;margin:0}.wrap{max-width:960px;margin:36px auto;padding:0 18px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:22px;margin:18px 0}form{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-weight:700;font-size:13px}input,select,button{width:100%;box-sizing:border-box;padding:11px;margin-top:6px;border:1px solid #ccd5e1;border-radius:8px;font:inherit}button{background:#1769e0;color:white;border:0;font-weight:700;cursor:pointer}.full{grid-column:1/-1}.msg{color:#b42318;min-height:20px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:11px 6px;border-bottom:1px solid #edf0f4}.small{width:auto;padding:7px 9px;display:inline-block}@media(max-width:620px){form{grid-template-columns:1fr}.table{font-size:12px}}</style></head><body><main class="wrap"><h1>Staff Management</h1><p>Create and manage users for this restaurant.</p><section class="card"><h2>Create staff user</h2><form id="create"><label>Name<input id="name" required></label><label>Username<input id="username" pattern="[A-Za-z0-9_.@+-]+" required></label><label>Email<input id="email" type="email" required></label><label>Role<select id="role"><option value="kitchen">Kitchen</option><option value="manager">Manager</option></select></label><label>Password<input id="password" type="password" minlength="10" required></label><label>Confirm password<input id="confirm" type="password" minlength="10" required></label><div class="full"><button>Create user</button><p id="msg" class="msg"></p></div></form></section><section class="card"><h2>Users</h2><table class="table"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Last login</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const $=x=>document.getElementById(x);async function api(url,o){o=o||{};o.credentials='include';const r=await fetch(url,o);if(r.status===401){location='/login.html';throw Error('Login required')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Request failed');return d}function load(){api('/staff').then(d=>{$('rows').innerHTML=(d.users||[]).map(u=>'<tr><td>'+u.name+'</td><td>'+u.username+'</td><td>'+u.role.toUpperCase()+'</td><td>'+u.status+'</td><td>'+(u.last_login?new Date(u.last_login).toLocaleString():'Never')+'</td><td>'+(u.role==='admin'?'—':'<button class="small" data-id="'+u.id+'" data-status="'+(u.status==='ACTIVE'?'DISABLED':'ACTIVE')+'">'+(u.status==='ACTIVE'?'Disable':'Enable')+'</button> <button class="small" data-reset="'+u.id+'">Reset</button>')+'</td></tr>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>api('/staff/'+b.dataset.id+'/status',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status:b.dataset.status})}).then(load).catch(e=>$('msg').textContent=e.message));document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{const p=prompt('New password (10+ characters):');if(!p)return;try{await api('/staff/'+b.dataset.reset+'/reset-password',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p})});alert('Password reset.')}catch(e){$('msg').textContent=e.message}})}).catch(e=>$('msg').textContent=e.message)}$('create').onsubmit=async e=>{e.preventDefault();$('msg').textContent='';if($('password').value!==$('confirm').value){$('msg').textContent='Passwords do not match';return}try{await api('/staff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('name').value.trim(),username:$('username').value.trim(),email:$('email').value.trim(),password:$('password').value,role:$('role').value})});e.target.reset();load()}catch(x){$('msg').textContent=x.message}}load()</script></body></html>
