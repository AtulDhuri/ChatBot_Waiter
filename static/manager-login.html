<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DineOS Manager Portal</title>
  <link rel="stylesheet" href="/css/login-card.css" />
</head>
<body>
  <main class="card">
    <div class="logo">DineOS</div>
    <div class="tag">Manager Portal</div>
    <h1>Welcome back</h1>
    <p>Sign in to manage orders, reports, and restaurant operations.</p>
    <form id="form">
      <label for="email">Manager email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button>Open Manager Portal</button>
      <p id="error" class="error"></p>
    </form>
    <p class="links"><a href="/forgot-password">Forgot password?</a> · <a href="/kitchen-login">Kitchen login</a></p>
  </main>
  <script src="/js/dist/manager-login.js"></script>
</body>
</html>
