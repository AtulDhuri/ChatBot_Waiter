<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DineOS Kitchen Portal</title>
  <link rel="stylesheet" href="/css/login-card.css" />
</head>
<body>
  <main class="card">
    <div class="logo">DineOS</div>
    <div class="tag">Kitchen Portal</div>
    <h1>Welcome, chef</h1>
    <p>Sign in to view and update your restaurant's kitchen orders.</p>
    <form id="form">
      <label for="username">Kitchen username</label>
      <input id="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button>Open Kitchen Portal</button>
      <p id="error" class="error"></p>
    </form>
    <p class="links"><a href="/forgot-password">Forgot password?</a></p>
  </main>
  <script src="/js/dist/kitchen-login.js"></script>
</body>
</html>
