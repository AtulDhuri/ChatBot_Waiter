<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DineOS Kitchen Portal</title><style>:root{font-family:system-ui;color:#17212f;background:#eef2f6}body{min-height:100vh;display:grid;place-items:center;margin:0}.card{background:#fff;width:min(390px,90vw);padding:36px;border-radius:18px;box-shadow:0 18px 50px #24344c1a}.logo{font-weight:800;font-size:25px;color:#123b72}.tag{color:#64748b;margin:6px 0 28px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #ccd5e1;border-radius:9px;box-sizing:border-box;font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.error{color:#b42318;min-height:20px;font-size:13px}.links{font-size:13px;margin-top:20px}.links a{color:#1769e0}</style></head><body><main class="card"><div class="logo">DineOS</div><div class="tag">Kitchen Portal</div><h1>Welcome, chef</h1><p>Sign in to view and update your restaurant's kitchen orders.</p><form id="form"><label for="username">Kitchen username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Open Kitchen Portal</button><p id="error" class="error"></p></form><p class="links"><a href="/forgot-password">Forgot password?</a></p></main><script>const form=document.getElementById('form');form.onsubmit=async e=>{e.preventDefault();const error=document.getElementById('error'),button=form.querySelector('button');error.textContent='';button.disabled=true;try{const r=await fetch('/auth/kitchen-login',{method:'POST',headers:{'content-type':'application/json'},credentials:'include',body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Login failed');location.href=d.redirect||'/kitchen.html'}catch(x){error.textContent=x.message;button.disabled=false}}</script></body></html>
